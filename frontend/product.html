<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product — SARI</title>
  <meta name="description" content="View product details from the SARI catalog.">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to product</a>

  <header class="site-header" data-header>
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="SARI home">
        <img class="brand-logo" src="assets/images/logo/sari-white.png" alt="" width="755" height="240">
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html">Catalog</a>
        <a class="nav-admin" href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="container product-view" id="product-view">
      <div class="page-loading">
        <i data-lucide="loader-2" class="spin" aria-hidden="true"></i>
        <p>Loading product…</p>
      </div>
    </div>
    <noscript>
      <div class="container">
        <div class="state state-wide">
          <h3>JavaScript is required</h3>
          <p>Please enable JavaScript to view product details.</p>
        </div>
      </div>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <a class="brand" href="index.html" aria-label="SARI home">
          <img class="brand-logo" src="assets/images/logo/sari-white.png" alt="" width="755" height="240">
        </a>
        <p>Pantry staples, homeware, and body care from small Filipino workshops.</p>
      </div>

      <nav class="footer-nav" aria-label="Footer">
        <a href="index.html">Catalog</a>
        <a href="admin.html">Admin</a>
      </nav>

      <div class="footer-meta">
        <p>© <span data-year></span> SARI</p>
        <p>A student project on NoSQL and cloud storage. Products are illustrative.</p>
      </div>
    </div>
  </footer>

  <script src="js/vendor/lucide.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
